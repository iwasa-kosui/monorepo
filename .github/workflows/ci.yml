name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 変更のあったアプリのジョブだけを走らせる。スキップしたジョブは必須チェックでは成功として扱われる。
  # ルートの依存やツールの設定、このワークフロー自体が変わったときは、すべてのジョブを走らせる。
  changes:
    name: "changes"
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.filter.outputs.result }}
      iori: ${{ steps.filter.outputs.iori }}
      nen-diagnosis: ${{ steps.filter.outputs.nen-diagnosis }}
      kosui-me: ${{ steps.filter.outputs.kosui-me }}
      es-patchwork-hands-on: ${{ steps.filter.outputs.es-patchwork-hands-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA")"
          else
            files=""
            all=true
          fi
          result=$all iori=$all nen=$all kosui=$all patchwork=$all
          while IFS= read -r file; do
            case "$file" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|dprint.json|.github/workflows/ci.yml)
                result=true iori=true nen=true kosui=true patchwork=true ;;
            esac
            case "$file" in packages/result/*) result=true iori=true ;; esac
            case "$file" in apps/iori/*|apps/nen-diagnosis/scripts/fonts/*) iori=true ;; esac
            case "$file" in apps/nen-diagnosis/*) nen=true ;; esac
            case "$file" in apps/kosui-me/*|talks/*) kosui=true ;; esac
            case "$file" in apps/es-patchwork-hands-on/*) patchwork=true ;; esac
          done <<< "$files"
          {
            echo "result=$result"
            echo "iori=$iori"
            echo "nen-diagnosis=$nen"
            echo "kosui-me=$kosui"
            echo "es-patchwork-hands-on=$patchwork"
          } | tee -a "$GITHUB_OUTPUT"
  result:
    name: "packages/result"
    needs: changes
    if: needs.changes.outputs.result == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter result run lint

      - name: Format check
        run: pnpm --filter result run format:check

      - name: Type check
        run: pnpm --filter result run typecheck

      - name: Build
        run: pnpm --filter result run build

      - name: Test
        run: pnpm --filter result run test:ci

  # iori は単体テストと、それ以外（静的検査・build・workerd テスト）の 2 つのジョブを並べて走らせ、
  # 最後の apps/iori ジョブで結果をまとめる（必須チェックの名前を変えないため）。
  iori-check:
    name: "apps/iori check"
    needs: changes
    if: needs.changes.outputs.iori == 'true'
    runs-on: ubuntu-latest
    env:
      VAPID_PUBLIC_KEY: "dummy-public-key-for-ci"
      VAPID_PRIVATE_KEY: "dummy-private-key-for-ci"
      VAPID_SUBJECT: "mailto:ci@example.com"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages/result
        run: pnpm --filter result run build

      - name: Lint
        run: pnpm --filter iori run lint

      - name: Format check
        run: pnpm --filter iori run format:check

      - name: Run guarded Cloudflare checks
        shell: bash
        run: |
          set -euo pipefail
          run_guarded() {
            local output status=0 guard_status=0
            output="$(mktemp)"
            "$@" >"$output" 2>&1 || status=$?
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || guard_status=$?
            rm -f "$output"
            if [ "$status" -ne 0 ] || [ "$guard_status" -ne 0 ]; then
              printf 'Guarded command failed: exit=%s guard=%s command=%s\n' "$status" "$guard_status" "$*" >&2
            fi
            if [ "$guard_status" -ne 0 ]; then return "$guard_status"; fi
            return "$status"
          }
          run_guarded pnpm --silent --filter iori run typecheck
          run_guarded pnpm --silent --filter iori exec vitest run --reporter=tap src/worker.task8.test.ts src/smokeWorker.test.ts
          export WORKER_NAME="iori-staging-fixture1"
          export ACCOUNT_ID="$(printf '%032d' 0)"
          export D1_DATABASE_ID="$(printf '%032d' 1)"
          export KV_NAMESPACE_ID="$(printf '%032d' 2)"
          export R2_BUCKET_NAME="iori-staging-fixture1-uploads"
          export R2_EVENT_ARCHIVE_BUCKET_NAME="iori-staging-fixture1-event-archive"
          export QUEUE_NAME="iori-staging-fixture1-fedify"
          export ORIGIN="https://iori.example.invalid"
          export IORI_ADMISSION_MODE=sealed
          iori_fixture_marker="00000000-0000-4000-8000-000000000000"
          export IORI_ADMISSION_IDENTITY="$(printf '{"environment":"staging","generation":"fixture1","mainSha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","runId":"fixture1","hostname":"iori.example.invalid","workerHostname":"iori-staging-fixture1.fixture.workers.dev","smoke":{"username":"iori-smoke","uploadFilename":"%s.png","articleId":"%s"}}' "$iori_fixture_marker" "$iori_fixture_marker")"
          run_guarded pnpm --silent --filter iori run deploy:worker:dry-run
          run_guarded pnpm --silent --filter iori run cloudflare:public-artifacts:check

      - name: Write redacted Cloudflare validation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' '## Iori Cloudflare validation'
            printf '%s\n' '- Public artifact policy: passed'
            printf '%s\n' '- Workflow-output redaction: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm --filter iori run build

      - name: Test on workerd
        run: pnpm --filter iori run test:workerd

  iori-test:
    name: "apps/iori test"
    needs: changes
    if: needs.changes.outputs.iori == 'true'
    runs-on: ubuntu-latest
    env:
      VAPID_PUBLIC_KEY: "dummy-public-key-for-ci"
      VAPID_PRIVATE_KEY: "dummy-private-key-for-ci"
      VAPID_SUBJECT: "mailto:ci@example.com"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages/result
        run: pnpm --filter result run build

      - name: Test
        run: pnpm --filter iori run test:ci

  iori:
    name: "apps/iori"
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, iori-check, iori-test]
    steps:
      - name: Require every iori job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IORI_CHANGED: ${{ needs.changes.outputs.iori }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Could not detect changed apps: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [ "$IORI_CHANGED" != "true" ]; then
            echo "apps/iori is unchanged; skipped."
            exit 0
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "An iori job did not succeed: $RESULTS" >&2
              exit 1
            fi
          done

  iori-terraform:
    name: "apps/iori terraform"
    needs: changes
    if: needs.changes.outputs.iori == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: "1.17.1"

      - name: Run guarded Terraform checks
        shell: bash
        run: |
          set -euo pipefail
          run_guarded() {
            local output status=0 guard_status=0
            output="$(mktemp)"
            "$@" >"$output" 2>&1 || status=$?
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || guard_status=$?
            rm -f "$output"
            if [ "$status" -ne 0 ] || [ "$guard_status" -ne 0 ]; then
              printf 'Guarded command failed: exit=%s guard=%s command=%s\n' "$status" "$guard_status" "$*" >&2
            fi
            if [ "$guard_status" -ne 0 ]; then return "$guard_status"; fi
            return "$status"
          }
          run_guarded terraform -chdir=apps/iori/infra/cloudflare fmt -check -recursive
          node apps/iori/scripts/run-guarded-retry.mjs terraform -chdir=apps/iori/infra/cloudflare init -backend=false -input=false -lockfile=readonly
          run_guarded terraform -chdir=apps/iori/infra/cloudflare validate

      - name: Write redacted Terraform validation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' '## Iori Terraform validation'
            printf '%s\n' '- Terraform validation: passed'
          } >> "$GITHUB_STEP_SUMMARY"

  nen-diagnosis:
    name: "apps/nen-diagnosis"
    needs: changes
    if: needs.changes.outputs.nen-diagnosis == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter nen-diagnosis run lint

      - name: Format check
        run: pnpm --filter nen-diagnosis run format:check

      - name: Type check
        run: pnpm --filter nen-diagnosis run typecheck

      - name: Build
        run: pnpm --filter nen-diagnosis run build

      - name: Test
        run: pnpm --filter nen-diagnosis run test:ci

  es-patchwork-exercises:
    name: "apps/es-patchwork-hands-on/exercises (node ${{ matrix.node-version }})"
    needs: changes
    if: needs.changes.outputs.es-patchwork-hands-on == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.12.0", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Check RED and GREEN of each snapshot
        run: node apps/es-patchwork-hands-on/scripts/check-exercises.ts

      - name: Type check
        working-directory: apps/es-patchwork-hands-on/exercises
        run: |
          npm install --no-save --no-package-lock typescript@5.9.3 @types/node@24.10.4
          npx tsc -p tsconfig.json

  kosui-me:
    name: "apps/kosui-me"
    needs: changes
    if: needs.changes.outputs.kosui-me == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate talks data
        run: pnpm --filter kosui-me run generate:talks

      - name: Lint
        run: pnpm --filter kosui-me run lint

      - name: Format check
        run: pnpm --filter kosui-me run format:check

      - name: Type check
        run: pnpm --filter kosui-me run typecheck

      - name: Test
        run: pnpm --filter kosui-me run test:ci

  es-patchwork-hands-on:
    name: "apps/es-patchwork-hands-on"
    needs: changes
    if: needs.changes.outputs.es-patchwork-hands-on == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter es-patchwork-hands-on run lint

      - name: Format check
        run: pnpm --filter es-patchwork-hands-on run format:check

      - name: Type check
        run: pnpm --filter es-patchwork-hands-on run typecheck

      - name: Build
        run: pnpm --filter es-patchwork-hands-on run build

      - name: Check exercises tarball
        run: node apps/es-patchwork-hands-on/scripts/check-exercises-tarball.ts

      - name: Check browser runtime matches node
        run: node apps/es-patchwork-hands-on/scripts/check-browser-runtime.ts

      - name: Test
        run: pnpm --filter es-patchwork-hands-on run test:ci

      - name: Install Playwright browsers
        run: pnpm --filter es-patchwork-hands-on exec playwright install --with-deps chromium firefox webkit

      - name: E2E test
        run: pnpm --filter es-patchwork-hands-on run test:e2e

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: es-patchwork-hands-on-playwright-test-results
          path: apps/es-patchwork-hands-on/test-results/
          if-no-files-found: ignore
          retention-days: 7
