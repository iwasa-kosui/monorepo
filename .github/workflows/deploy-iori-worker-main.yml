name: Deploy iori Worker (main)

on:
  push:
    branches: [main]
    paths:
      - "apps/iori/src/**"
      - "!apps/iori/src/**/*.test.ts"
      - "!apps/iori/src/**/*.test.tsx"
      - "!apps/iori/src/**/__tests__/**"
      - "!apps/iori/src/testing/**"
      - "apps/iori/public/**"
      - "apps/iori/drizzle-d1/**"
      - "apps/iori/workers/iori/wrangler.template.jsonc"
      - "apps/iori/infra/cloudflare/*.tf"
      - "apps/iori/infra/cloudflare/.terraform.lock.hcl"
      - "apps/iori/scripts/**"
      - "!apps/iori/scripts/__tests__/**"
      - "!apps/iori/scripts/**/*.d.mts"
      - "apps/iori/package.json"
      - "apps/iori/tsconfig.json"
      - "apps/iori/vite.config.js"
      - "packages/result/src/**"
      - "!packages/result/src/**/*.test.ts"
      - "packages/result/package.json"
      - "packages/result/tsconfig.json"
      - "packages/result/tsconfig.build.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-iori-worker-main.yml"

concurrency:
  group: deploy-iori-worker-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  MAIN_SHA: ${{ github.sha }}
  IORI_OPERATION: deploy-worker
  IORI_ENVIRONMENT: production
  WRANGLER_SEND_METRICS: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  public-artifact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record first-step deadline and gate trusted event
        shell: bash
        run: |
          set -euo pipefail
          printf 'IORI_JOB_STARTED_AT=%s000\n' "$(date +%s)" >> "$GITHUB_ENV"
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$MAIN_SHA" = "$GITHUB_SHA"
          case "$IORI_OPERATION" in
            reconcile-resources|replace-queue-consumer) printf '%s\n' 'Maintenance operation requires a separate review.'; exit 1 ;;
          esac
      - name: Checkout trusted event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
      - name: Create fresh private job directory
        run: node apps/iori/scripts/hosted-workflow.mjs init
      - name: Install and build with private diagnostics
        run: node apps/iori/scripts/hosted-workflow.mjs setup
      - name: Check public artifact policy with sanitized output
        run: node apps/iori/scripts/hosted-workflow.mjs public-check
      - name: Remove this job's private directory
        if: always() && env.IORI_PRIVATE_DIRECTORY != ''
        run: node apps/iori/scripts/cleanup-private-workflow-directory.mjs

  deploy-worker:
    needs: public-artifact-gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    steps:
      - name: Record first-step deadline and gate trusted event
        shell: bash
        run: |
          set -euo pipefail
          printf 'IORI_JOB_STARTED_AT=%s000\n' "$(date +%s)" >> "$GITHUB_ENV"
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$MAIN_SHA" = "$GITHUB_SHA"
          case "$IORI_OPERATION" in
            reconcile-resources|replace-queue-consumer) printf '%s\n' 'Maintenance operation requires a separate review.'; exit 1 ;;
          esac
      - name: Checkout trusted event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
      - name: Create fresh private job directory
        run: node apps/iori/scripts/hosted-workflow.mjs init
      - name: Setup Terraform without public wrapper outputs
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: "1.17.1"
      - name: Install and build with private diagnostics
        run: node apps/iori/scripts/hosted-workflow.mjs setup
      - name: Run fixed protected operation
        run: node apps/iori/scripts/hosted-workflow.mjs operate
        env:
          IORI_ADMISSION_MODE: sealed
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          IORI_TERRAFORM_BACKEND_BUCKET: ${{ secrets.IORI_TERRAFORM_BACKEND_BUCKET }}
          IORI_ADMISSION_IDENTITY: ${{ secrets.IORI_ADMISSION_IDENTITY }}
          ORIGIN: ${{ secrets.ORIGIN }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.IORI_CLOUDFLARE_DEPLOY_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.IORI_TERRAFORM_READ_ONLY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IORI_TERRAFORM_READ_ONLY_SECRET_ACCESS_KEY }}
          IORI_MIGRATION_R2_ACCESS_KEY_ID: ${{ secrets.IORI_TRANSFER_R2_READ_ONLY_ACCESS_KEY_ID }}
          IORI_MIGRATION_R2_SECRET_ACCESS_KEY: ${{ secrets.IORI_TRANSFER_R2_READ_ONLY_SECRET_ACCESS_KEY }}
      - name: Remove this job's private directory
        if: always() && env.IORI_PRIVATE_DIRECTORY != ''
        run: node apps/iori/scripts/cleanup-private-workflow-directory.mjs
