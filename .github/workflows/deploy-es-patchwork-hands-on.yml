name: Deploy es-patchwork-hands-on

on:
  push:
    branches:
      - main
    paths:
      - "apps/es-patchwork-hands-on/**"
      - ".github/workflows/deploy-es-patchwork-hands-on.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ES_PATCHWORK_CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter es-patchwork-hands-on run typecheck

      - name: Test
        run: pnpm --filter es-patchwork-hands-on run test:ci

      - name: Build
        run: pnpm --filter es-patchwork-hands-on run build

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter es-patchwork-hands-on exec wrangler deploy
