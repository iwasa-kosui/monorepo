name: Deploy iori
on:
  push:
    branches: [main]
    paths: ["apps/iori/**", "packages/**", ".github/workflows/deploy-iori.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-iori-worker-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  MAIN_SHA: ${{ github.sha }}
  IORI_OPERATION: source
  WRANGLER_SEND_METRICS: "false"
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    steps:
      - name: Record first-step deadline and gate trusted event
        shell: bash
        run: |
          set -euo pipefail
          printf 'IORI_JOB_STARTED_AT=%s000\n' "$(date +%s)" >> "$GITHUB_ENV"
          [[ "$GITHUB_EVENT_NAME" = push || "$GITHUB_EVENT_NAME" = workflow_dispatch ]]
          test "$GITHUB_REF" = refs/heads/main
          [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$MAIN_SHA" = "$GITHUB_SHA"
          case "$IORI_OPERATION" in
            reconcile-resources|replace-queue-consumer) printf '%s\n' 'Maintenance operation requires a separate review.'; exit 1 ;;
          esac
      - name: Checkout trusted event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
      - name: Create fresh private job directory
        run: node apps/iori/scripts/hosted-workflow.mjs init
      - name: Install and build with private diagnostics
        run: node apps/iori/scripts/hosted-workflow.mjs setup
      - name: Deploy guarded exact source revision
        run: node apps/iori/scripts/hosted-workflow.mjs operate
        env:
          IORI_SOURCE_SSH_HOST: ${{ secrets.IORI_SOURCE_SSH_HOST }}
          IORI_SOURCE_SSH_USER: ${{ secrets.IORI_SOURCE_SSH_USER }}
          IORI_SOURCE_SSH_PRIVATE_KEY: ${{ secrets.IORI_SOURCE_SSH_PRIVATE_KEY }}
          IORI_SOURCE_SSH_KNOWN_HOSTS: ${{ secrets.IORI_SOURCE_SSH_KNOWN_HOSTS }}
      - name: Remove this job's private directory
        if: always() && env.IORI_PRIVATE_DIRECTORY != ''
        run: node apps/iori/scripts/cleanup-private-workflow-directory.mjs
