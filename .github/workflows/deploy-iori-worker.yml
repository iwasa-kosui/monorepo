name: Deploy iori Worker

on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: Protected, current main commit SHA to deploy
        required: true
        type: string
      operation:
        description: Protected production operation
        required: true
        type: choice
        options:
          - deploy-worker
          - migrate-data
          - reconcile-resources
          - replace-queue-consumer
          - cutover-route
      production_route:
        description: Protected route state for reconcile and consumer replacement
        required: true
        default: absent
        type: choice
        options:
          - absent
          - present
      migration_run_id:
        description: Protected run ID bound to the reviewed migration evidence contract
        required: true
        type: string

concurrency:
  group: deploy-iori-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public-artifact-gate:
    name: Verify public Iori deployment artifacts
    runs-on: ubuntu-latest
    env:
      MAIN_SHA: ${{ inputs.main_sha }}
    steps:
      - name: Checkout protected main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0

      - name: Verify protected main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public artifacts and write redacted summary
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f -- "$output"' EXIT
          status=0
          guard_status=0
          pnpm --filter iori run cloudflare:public-artifacts:check >"$output" 2>&1 || status=$?
          node apps/iori/scripts/assert-workflow-output.mjs <"$output" || guard_status=$?
          [ "$guard_status" -eq 0 ]
          [ "$status" -eq 0 ]
          {
            printf '%s\n' '## Iori Cloudflare public-artifact gate'
            printf '%s\n' '- Public artifact policy: passed'
            printf '%s\n' '- Workflow-output redaction: passed'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-worker:
    if: inputs.operation == 'deploy-worker'
    needs: public-artifact-gate
    name: Deploy Wrangler-owned Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MAIN_SHA: ${{ inputs.main_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORIGIN: ${{ secrets.IORI_ORIGIN }}
      VAPID_SUBJECT: ${{ secrets.IORI_VAPID_SUBJECT }}
      VAPID_PUBLIC_KEY: ${{ secrets.IORI_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.IORI_VAPID_PRIVATE_KEY }}
      SMOKE_QUEUE_TOKEN: ${{ secrets.IORI_SMOKE_QUEUE_TOKEN }}
      IORI_SMOKE_ORIGIN: ${{ secrets.IORI_SMOKE_ORIGIN }}
      IORI_SMOKE_ALLOWED_HOSTNAME: ${{ secrets.IORI_SMOKE_ALLOWED_HOSTNAME }}
      IORI_SMOKE_CHECKS_JSON: ${{ secrets.IORI_SMOKE_CHECKS_JSON }}
      IORI_SMOKE_QUEUE_TOKEN: ${{ secrets.IORI_SMOKE_QUEUE_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_environment: production
      TF_VAR_worker_name: ${{ secrets.IORI_WORKER_NAME }}
      TF_VAR_public_hostname: ${{ secrets.IORI_PUBLIC_HOSTNAME }}
      TF_VAR_enable_production_worker_route: ${{ inputs.production_route == 'present' }}
      R2_STATE_BUCKET: ${{ secrets.IORI_TERRAFORM_STATE_BUCKET }}
      R2_STATE_ENDPOINT: ${{ secrets.IORI_TERRAFORM_STATE_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.IORI_TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.IORI_TERRAFORM_STATE_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout protected main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0

      - name: Verify protected main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@v3

      - name: Create private temporary directory
        shell: bash
        run: |
          set -euo pipefail
          private_directory="$(mktemp -d "${RUNNER_TEMP:?}/iori-private-XXXXXXXX")"
          chmod 700 "$private_directory"
          printf 'TMPDIR=%s\n' "$private_directory" >> "$GITHUB_ENV"
          printf 'IORI_PRIVATE_DIRECTORY=%s\n' "$private_directory" >> "$GITHUB_ENV"
          printf 'WRANGLER_LOG_PATH=%s/wrangler-logs\n' "$private_directory" >> "$GITHUB_ENV"

      - name: Materialize Terraform-derived private Worker bindings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backend_config="$IORI_PRIVATE_DIRECTORY/config.s3.tfbackend"
          terraform_bindings="$IORI_PRIVATE_DIRECTORY/worker-bindings.terraform.json"
          worker_bindings="$IORI_PRIVATE_DIRECTORY/worker-bindings.json"
          output="$IORI_PRIVATE_DIRECTORY/binding-materialization-output"
          printf 'bucket = "%s"\nkey = "apps/iori/cloudflare/production.tfstate"\nregion = "auto"\nendpoint = "%s"\n' "$R2_STATE_BUCKET" "$R2_STATE_ENDPOINT" > "$backend_config"
          if ! terraform -chdir=apps/iori/infra/cloudflare init -input=false -backend-config="$backend_config" >"$output" 2>&1; then
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || true
            exit 1
          fi
          if ! terraform -chdir=apps/iori/infra/cloudflare output -json worker_bindings >"$terraform_bindings" 2>>"$output"; then
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || true
            exit 1
          fi
          if ! node apps/iori/scripts/materialize-worker-bindings.mjs --input "$terraform_bindings" --output "$worker_bindings" --expected-worker-name "$TF_VAR_worker_name" >>"$output" 2>&1; then
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || true
            exit 1
          fi
          node apps/iori/scripts/assert-workflow-output.mjs <"$output"
          rm -f "$output" "$terraform_bindings"
          printf 'IORI_WORKER_BINDINGS_PATH=%s\n' "$worker_bindings" >> "$GITHUB_ENV"
          printf '%s\n' 'IORI_REQUIRE_TERRAFORM_BINDINGS=true' >> "$GITHUB_ENV"

      - name: Reject changed Terraform bindings before Worker deployment
        shell: bash
        run: |
          set -euo pipefail
          plan="$IORI_PRIVATE_DIRECTORY/deploy-worker.plan"
          plan_json="$IORI_PRIVATE_DIRECTORY/deploy-worker.plan.json"
          plan_stderr="$IORI_PRIVATE_DIRECTORY/deploy-worker-plan.stderr"
          trap 'rm -f -- "$plan" "$plan_json" "$plan_stderr"' EXIT
          if ! terraform -chdir=apps/iori/infra/cloudflare plan -input=false -out="$plan" >"$plan_stderr" 2>&1; then
            node apps/iori/scripts/assert-workflow-output.mjs <"$plan_stderr" || true
            exit 1
          fi
          if ! terraform -chdir=apps/iori/infra/cloudflare show -json "$plan" >"$plan_json" 2>>"$plan_stderr"; then
            node apps/iori/scripts/assert-workflow-output.mjs --private-terraform-plan "$plan_json" || true
            node apps/iori/scripts/assert-workflow-output.mjs <"$plan_stderr" || true
            exit 1
          fi
          node apps/iori/scripts/assert-workflow-output.mjs --private-terraform-plan "$plan_json"
          node apps/iori/scripts/assert-workflow-output.mjs <"$plan_stderr"
          node apps/iori/scripts/validate-cloudflare-plan.mjs --operation reconcile "$plan_json" --require-worker-bindings-no-op >"$IORI_PRIVATE_DIRECTORY/deploy-worker-plan-summary"
          node apps/iori/scripts/assert-workflow-output.mjs <"$IORI_PRIVATE_DIRECTORY/deploy-worker-plan-summary"

      - name: Build, typecheck, migrate, and deploy without public output
        shell: bash
        run: |
          set -euo pipefail
          run_guarded() {
            local output status=0 guard_status=0
            output="$(mktemp)"
            "$@" >"$output" 2>&1 || status=$?
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || guard_status=$?
            rm -f "$output"
            if [ "$guard_status" -ne 0 ]; then return "$guard_status"; fi
            return "$status"
          }
          run_guarded pnpm --silent --filter result run build
          run_guarded pnpm --silent --filter iori run typecheck
          run_guarded pnpm --silent --filter iori run build:client
          run_guarded pnpm --silent --filter iori run d1:migrate:remote
          run_guarded pnpm --silent --filter iori run deploy:worker

      - name: Run protected smoke tests
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f -- "$output"' EXIT
          node apps/iori/scripts/run-cloudflare-smoke.mjs \
            --base-url "$IORI_SMOKE_ORIGIN" \
            --expected-origin "$IORI_SMOKE_ORIGIN" \
            --allowed-hostname "$IORI_SMOKE_ALLOWED_HOSTNAME" \
            --checks-json "$IORI_SMOKE_CHECKS_JSON" \
            --smoke-queue-token "$IORI_SMOKE_QUEUE_TOKEN" >"$output" 2>&1
          node apps/iori/scripts/assert-workflow-output.mjs <"$output"

      - name: Remove private temporary directory
        if: always()
        shell: bash
        run: node apps/iori/scripts/cleanup-private-workflow-directory.mjs

  verify-import:
    if: inputs.operation == 'cutover-route'
    needs: public-artifact-gate
    name: Verify protected import before route cutover
    runs-on: [self-hosted, iori-production-migration]
    timeout-minutes: 20
    environment: production
    env:
      MAIN_SHA: ${{ inputs.main_sha }}
      IORI_MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
      IORI_MIGRATION_CONTRACT: ${{ secrets.IORI_MIGRATION_CONTRACT_PATH }}
      IORI_EXPORT_MANIFEST: ${{ secrets.IORI_EXPORT_MANIFEST_PATH }}
      IORI_D1_IMPORT_MANIFEST: ${{ secrets.IORI_D1_IMPORT_MANIFEST_PATH }}
      IORI_R2_IMPORT_MANIFEST: ${{ secrets.IORI_R2_IMPORT_MANIFEST_PATH }}
      IORI_OGP_IMPORT_MANIFEST: ${{ secrets.IORI_OGP_IMPORT_MANIFEST_PATH }}
      IORI_IMPORT_RUNNER: ${{ secrets.IORI_IMPORT_RUNNER_PATH }}
      IORI_IMPORT_RUNNER_SHA256: ${{ secrets.IORI_IMPORT_RUNNER_SHA256 }}
      IORI_MIGRATION_RECEIPT_PUBLIC_KEY_PATH: ${{ secrets.IORI_MIGRATION_RECEIPT_PUBLIC_KEY_PATH }}
      IORI_MIGRATION_RECEIPT_PUBLIC_KEY_SHA256: ${{ secrets.IORI_MIGRATION_RECEIPT_PUBLIC_KEY_SHA256 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout protected main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0

      - name: Verify protected main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate protected mounted import verification contract
        shell: bash
        run: |
          set -euo pipefail
          node apps/iori/scripts/validate-private-mounted-inputs.mjs --require-contract
          output="$(mktemp)"
          if ! node --check "$IORI_IMPORT_RUNNER" >"$output" 2>&1; then
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || true
            exit 1
          fi
          node apps/iori/scripts/assert-workflow-output.mjs <"$output"
          rm -f "$output"

      - name: Verify imports without public output
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f -- "$output"' EXIT
          pnpm --filter iori run cloudflare:migrate:protected >"$output" 2>&1
          node apps/iori/scripts/assert-workflow-output.mjs <"$output"

  migrate-data:
    if: inputs.operation == 'migrate-data'
    needs: public-artifact-gate
    name: Verify completed migration evidence and imported data
    runs-on: [self-hosted, iori-production-migration]
    timeout-minutes: 60
    environment: production
    env:
      MAIN_SHA: ${{ inputs.main_sha }}
      IORI_MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
      IORI_MIGRATION_CONTRACT: ${{ secrets.IORI_MIGRATION_CONTRACT_PATH }}
      IORI_EXPORT_MANIFEST: ${{ secrets.IORI_EXPORT_MANIFEST_PATH }}
      IORI_D1_IMPORT_MANIFEST: ${{ secrets.IORI_D1_IMPORT_MANIFEST_PATH }}
      IORI_R2_IMPORT_MANIFEST: ${{ secrets.IORI_R2_IMPORT_MANIFEST_PATH }}
      IORI_OGP_IMPORT_MANIFEST: ${{ secrets.IORI_OGP_IMPORT_MANIFEST_PATH }}
      IORI_IMPORT_RUNNER: ${{ secrets.IORI_IMPORT_RUNNER_PATH }}
      IORI_IMPORT_RUNNER_SHA256: ${{ secrets.IORI_IMPORT_RUNNER_SHA256 }}
      IORI_MIGRATION_RECEIPT_PUBLIC_KEY_PATH: ${{ secrets.IORI_MIGRATION_RECEIPT_PUBLIC_KEY_PATH }}
      IORI_MIGRATION_RECEIPT_PUBLIC_KEY_SHA256: ${{ secrets.IORI_MIGRATION_RECEIPT_PUBLIC_KEY_SHA256 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0
      - name: Verify protected main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate protected mounted migration contract
        shell: bash
        run: |
          set -euo pipefail
          node apps/iori/scripts/validate-private-mounted-inputs.mjs --require-contract
      - name: Run deterministic ordered migration verification without public output
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f -- "$output"' EXIT
          status=0
          guard_status=0
          pnpm --filter iori run cloudflare:migrate:protected >"$output" 2>&1 || status=$?
          node apps/iori/scripts/assert-workflow-output.mjs <"$output" || guard_status=$?
          [ "$guard_status" -eq 0 ]
          [ "$status" -eq 0 ]

  workers-dev-validation:
    if: inputs.operation == 'cutover-route'
    needs: public-artifact-gate
    name: Validate protected workers.dev origin before route cutover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      MAIN_SHA: ${{ inputs.main_sha }}
      IORI_WORKERS_DEV_SMOKE_ORIGIN: ${{ secrets.IORI_WORKERS_DEV_SMOKE_ORIGIN }}
      IORI_WORKERS_DEV_SMOKE_CHECKS_JSON: ${{ secrets.IORI_WORKERS_DEV_SMOKE_CHECKS_JSON }}
      IORI_WORKERS_DEV_SMOKE_QUEUE_TOKEN: ${{ secrets.IORI_WORKERS_DEV_SMOKE_QUEUE_TOKEN }}
      IORI_WORKERS_DEV_SMOKE_ALLOWED_HOSTNAME: ${{ secrets.IORI_WORKERS_DEV_SMOKE_ALLOWED_HOSTNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0
      - name: Verify protected main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run protected workers.dev smoke gate
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          node apps/iori/scripts/run-cloudflare-smoke.mjs \
            --base-url "$IORI_WORKERS_DEV_SMOKE_ORIGIN" \
            --expected-origin "$IORI_WORKERS_DEV_SMOKE_ORIGIN" \
            --allowed-hostname "$IORI_WORKERS_DEV_SMOKE_ALLOWED_HOSTNAME" \
            --checks-json "$IORI_WORKERS_DEV_SMOKE_CHECKS_JSON" \
            --smoke-queue-token "$IORI_WORKERS_DEV_SMOKE_QUEUE_TOKEN" >"$output" 2>&1
          node apps/iori/scripts/assert-workflow-output.mjs <"$output"
          rm -f "$output"

  reconcile-resources:
    if: inputs.operation == 'reconcile-resources'
    needs: public-artifact-gate
    name: Reconcile Terraform-owned resources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MAIN_SHA: ${{ inputs.main_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_environment: production
      TF_VAR_worker_name: ${{ secrets.IORI_WORKER_NAME }}
      TF_VAR_public_hostname: ${{ secrets.IORI_PUBLIC_HOSTNAME }}
      TF_VAR_enable_production_worker_route: ${{ inputs.production_route == 'present' }}
      R2_STATE_BUCKET: ${{ secrets.IORI_TERRAFORM_STATE_BUCKET }}
      R2_STATE_ENDPOINT: ${{ secrets.IORI_TERRAFORM_STATE_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.IORI_TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.IORI_TERRAFORM_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0
      - name: Verify protected main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: hashicorp/setup-terraform@v3
      - name: Validate and apply the saved resource plan without public output
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf -- "$temporary_directory"' EXIT
          backend_config="$temporary_directory/config.s3.tfbackend"
          plan="$temporary_directory/plan"
          plan_json="$temporary_directory/plan.json"
          plan_show_stderr="$temporary_directory/plan-show.stderr"
          umask 077
          printf 'bucket = "%s"\nkey = "apps/iori/cloudflare/production.tfstate"\nregion = "auto"\nendpoint = "%s"\n' "$R2_STATE_BUCKET" "$R2_STATE_ENDPOINT" > "$backend_config"
          run_guarded() { local output status=0 guard_status=0; output="$(mktemp)"; "$@" >"$output" 2>&1 || status=$?; node apps/iori/scripts/assert-workflow-output.mjs <"$output" || guard_status=$?; rm -f "$output"; [ "$guard_status" -eq 0 ] || return "$guard_status"; return "$status"; }
          write_plan_summary() { local action_summary="$temporary_directory/action-summary"; if ! node apps/iori/scripts/validate-cloudflare-plan.mjs --operation "$1" "$plan_json" >"$action_summary"; then node apps/iori/scripts/assert-workflow-output.mjs <"$action_summary" || true; return 1; fi; node apps/iori/scripts/assert-workflow-output.mjs <"$action_summary"; printf '%s\n' '## Terraform action summary' >> "$GITHUB_STEP_SUMMARY"; cat "$action_summary" >> "$GITHUB_STEP_SUMMARY"; }
          run_guarded terraform -chdir=apps/iori/infra/cloudflare init -input=false -backend-config="$backend_config"
          run_guarded terraform -chdir=apps/iori/infra/cloudflare plan -input=false -out="$plan"
          if ! terraform -chdir=apps/iori/infra/cloudflare show -json "$plan" > "$plan_json" 2> "$plan_show_stderr"; then
            node apps/iori/scripts/assert-workflow-output.mjs --private-terraform-plan "$plan_json" || true
            node apps/iori/scripts/assert-workflow-output.mjs < "$plan_show_stderr" || true
            exit 1
          fi
          node apps/iori/scripts/assert-workflow-output.mjs --private-terraform-plan "$plan_json"
          node apps/iori/scripts/assert-workflow-output.mjs < "$plan_show_stderr"
          write_plan_summary reconcile
          run_guarded terraform -chdir=apps/iori/infra/cloudflare apply -input=false "$plan"

  replace-queue-consumer:
    if: inputs.operation == 'replace-queue-consumer'
    needs: public-artifact-gate
    name: Replace Queue consumer after Wrangler producer handoff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      MAIN_SHA: ${{ inputs.main_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORIGIN: ${{ secrets.IORI_ORIGIN }}
      VAPID_SUBJECT: ${{ secrets.IORI_VAPID_SUBJECT }}
      VAPID_PUBLIC_KEY: ${{ secrets.IORI_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.IORI_VAPID_PRIVATE_KEY }}
      SMOKE_QUEUE_TOKEN: ${{ secrets.IORI_SMOKE_QUEUE_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_environment: production
      TF_VAR_worker_name: ${{ secrets.IORI_WORKER_NAME }}
      TF_VAR_public_hostname: ${{ secrets.IORI_PUBLIC_HOSTNAME }}
      TF_VAR_enable_production_worker_route: ${{ inputs.production_route == 'present' }}
      R2_STATE_BUCKET: ${{ secrets.IORI_TERRAFORM_STATE_BUCKET }}
      R2_STATE_ENDPOINT: ${{ secrets.IORI_TERRAFORM_STATE_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.IORI_TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.IORI_TERRAFORM_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0
      - name: Verify protected main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"
      - uses: hashicorp/setup-terraform@v3
      - run: pnpm install --frozen-lockfile
      - name: Create private temporary directory
        shell: bash
        run: |
          set -euo pipefail
          private_directory="$(mktemp -d "${RUNNER_TEMP:?}/iori-private-XXXXXXXX")"
          chmod 700 "$private_directory"
          printf 'TMPDIR=%s\n' "$private_directory" >> "$GITHUB_ENV"
          printf 'IORI_PRIVATE_DIRECTORY=%s\n' "$private_directory" >> "$GITHUB_ENV"
      - name: Materialize Terraform-derived private Worker bindings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backend_config="$IORI_PRIVATE_DIRECTORY/config.s3.tfbackend"
          terraform_bindings="$IORI_PRIVATE_DIRECTORY/worker-bindings.terraform.json"
          worker_bindings="$IORI_PRIVATE_DIRECTORY/worker-bindings.json"
          output="$IORI_PRIVATE_DIRECTORY/binding-materialization-output"
          printf 'bucket = "%s"\nkey = "apps/iori/cloudflare/production.tfstate"\nregion = "auto"\nendpoint = "%s"\n' "$R2_STATE_BUCKET" "$R2_STATE_ENDPOINT" > "$backend_config"
          if ! terraform -chdir=apps/iori/infra/cloudflare init -input=false -backend-config="$backend_config" >"$output" 2>&1; then
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || true
            exit 1
          fi
          if ! terraform -chdir=apps/iori/infra/cloudflare output -json worker_bindings >"$terraform_bindings" 2>>"$output"; then
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || true
            exit 1
          fi
          if ! node apps/iori/scripts/materialize-worker-bindings.mjs --input "$terraform_bindings" --output "$worker_bindings" --expected-worker-name "$TF_VAR_worker_name" >>"$output" 2>&1; then
            node apps/iori/scripts/assert-workflow-output.mjs <"$output" || true
            exit 1
          fi
          node apps/iori/scripts/assert-workflow-output.mjs <"$output"
          rm -f "$output" "$terraform_bindings"
          printf 'IORI_WORKER_BINDINGS_PATH=%s\n' "$worker_bindings" >> "$GITHUB_ENV"
          printf '%s\n' 'IORI_REQUIRE_TERRAFORM_BINDINGS=true' >> "$GITHUB_ENV"
      - name: Deploy version without producer, apply saved plan, and restore producer
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$IORI_PRIVATE_DIRECTORY/consumer-plan"
          mkdir -m 700 "$temporary_directory"
          trap 'rm -rf -- "$temporary_directory"' EXIT
          backend_config="$temporary_directory/config.s3.tfbackend"
          plan="$temporary_directory/plan"
          plan_json="$temporary_directory/plan.json"
          plan_show_stderr="$temporary_directory/plan-show.stderr"
          umask 077
          printf 'bucket = "%s"\nkey = "apps/iori/cloudflare/production.tfstate"\nregion = "auto"\nendpoint = "%s"\n' "$R2_STATE_BUCKET" "$R2_STATE_ENDPOINT" > "$backend_config"
          run_guarded() { local output status=0 guard_status=0; output="$(mktemp)"; "$@" >"$output" 2>&1 || status=$?; node apps/iori/scripts/assert-workflow-output.mjs <"$output" || guard_status=$?; rm -f "$output"; [ "$guard_status" -eq 0 ] || return "$guard_status"; return "$status"; }
          write_plan_summary() { local action_summary="$temporary_directory/action-summary"; if ! node apps/iori/scripts/validate-cloudflare-plan.mjs --operation "$1" "$plan_json" --require-worker-bindings-no-op >"$action_summary"; then node apps/iori/scripts/assert-workflow-output.mjs <"$action_summary" || true; return 1; fi; node apps/iori/scripts/assert-workflow-output.mjs <"$action_summary"; printf '%s\n' '## Terraform action summary' >> "$GITHUB_STEP_SUMMARY"; cat "$action_summary" >> "$GITHUB_STEP_SUMMARY"; }
          run_guarded terraform -chdir=apps/iori/infra/cloudflare init -input=false -backend-config="$backend_config"
          run_guarded terraform -chdir=apps/iori/infra/cloudflare plan -input=false -out="$plan"
          if ! terraform -chdir=apps/iori/infra/cloudflare show -json "$plan" > "$plan_json" 2> "$plan_show_stderr"; then
            node apps/iori/scripts/assert-workflow-output.mjs --private-terraform-plan "$plan_json" || true
            node apps/iori/scripts/assert-workflow-output.mjs < "$plan_show_stderr" || true
            exit 1
          fi
          node apps/iori/scripts/assert-workflow-output.mjs --private-terraform-plan "$plan_json"
          node apps/iori/scripts/assert-workflow-output.mjs < "$plan_show_stderr"
          write_plan_summary consumer-replacement
          printf '%s\n' 'IORI_QUEUE_PRODUCER_REMOVED=true' >> "$GITHUB_ENV"
          run_guarded pnpm --silent --filter iori run deploy:worker -- --without-queue-producer
          run_guarded terraform -chdir=apps/iori/infra/cloudflare apply -input=false "$plan"
      - name: Restore Wrangler Queue producer binding
        if: always() && env.IORI_QUEUE_PRODUCER_REMOVED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          pnpm --filter iori run deploy:worker >"$output" 2>&1
          node apps/iori/scripts/assert-workflow-output.mjs <"$output"
          rm -f "$output"
      - name: Remove private temporary directory
        if: always()
        shell: bash
        run: node apps/iori/scripts/cleanup-private-workflow-directory.mjs

  cutover-route:
    if: inputs.operation == 'cutover-route'
    needs: [public-artifact-gate, verify-import, workers-dev-validation]
    name: Apply reviewed production route cutover plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MAIN_SHA: ${{ inputs.main_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_environment: production
      TF_VAR_worker_name: ${{ secrets.IORI_WORKER_NAME }}
      TF_VAR_public_hostname: ${{ secrets.IORI_PUBLIC_HOSTNAME }}
      TF_VAR_enable_production_worker_route: "true"
      R2_STATE_BUCKET: ${{ secrets.IORI_TERRAFORM_STATE_BUCKET }}
      R2_STATE_ENDPOINT: ${{ secrets.IORI_TERRAFORM_STATE_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.IORI_TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.IORI_TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      IORI_SMOKE_ORIGIN: ${{ secrets.IORI_SMOKE_ORIGIN }}
      IORI_SMOKE_CHECKS_JSON: ${{ secrets.IORI_SMOKE_CHECKS_JSON }}
      IORI_SMOKE_QUEUE_TOKEN: ${{ secrets.IORI_SMOKE_QUEUE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0
      - name: Verify protected main SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: pnpm/action-setup@v4
      - uses: hashicorp/setup-terraform@v3
      - run: pnpm install --frozen-lockfile
      - name: Validate and apply reviewed route plan without public output
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf -- "$temporary_directory"' EXIT
          backend_config="$temporary_directory/config.s3.tfbackend"
          plan="$temporary_directory/plan"
          plan_json="$temporary_directory/plan.json"
          plan_show_stderr="$temporary_directory/plan-show.stderr"
          umask 077
          printf 'bucket = "%s"\nkey = "apps/iori/cloudflare/production.tfstate"\nregion = "auto"\nendpoint = "%s"\n' "$R2_STATE_BUCKET" "$R2_STATE_ENDPOINT" > "$backend_config"
          run_guarded() { local output status=0 guard_status=0; output="$(mktemp)"; "$@" >"$output" 2>&1 || status=$?; node apps/iori/scripts/assert-workflow-output.mjs <"$output" || guard_status=$?; rm -f "$output"; [ "$guard_status" -eq 0 ] || return "$guard_status"; return "$status"; }
          write_plan_summary() { local action_summary="$temporary_directory/action-summary"; if ! node apps/iori/scripts/validate-cloudflare-plan.mjs --operation "$1" "$plan_json" --allow-production-route --require-worker-bindings-no-op >"$action_summary"; then node apps/iori/scripts/assert-workflow-output.mjs <"$action_summary" || true; return 1; fi; node apps/iori/scripts/assert-workflow-output.mjs <"$action_summary"; printf '%s\n' '## Terraform action summary' >> "$GITHUB_STEP_SUMMARY"; cat "$action_summary" >> "$GITHUB_STEP_SUMMARY"; }
          run_guarded terraform -chdir=apps/iori/infra/cloudflare init -input=false -backend-config="$backend_config"
          run_guarded terraform -chdir=apps/iori/infra/cloudflare plan -input=false -out="$plan"
          if ! terraform -chdir=apps/iori/infra/cloudflare show -json "$plan" > "$plan_json" 2> "$plan_show_stderr"; then
            node apps/iori/scripts/assert-workflow-output.mjs --private-terraform-plan "$plan_json" || true
            node apps/iori/scripts/assert-workflow-output.mjs < "$plan_show_stderr" || true
            exit 1
          fi
          node apps/iori/scripts/assert-workflow-output.mjs --private-terraform-plan "$plan_json"
          node apps/iori/scripts/assert-workflow-output.mjs < "$plan_show_stderr"
          write_plan_summary route-cutover
          run_guarded terraform -chdir=apps/iori/infra/cloudflare apply -input=false "$plan"

      - name: Run protected post-cutover smoke
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          node apps/iori/scripts/run-cloudflare-smoke.mjs \
            --base-url "$IORI_SMOKE_ORIGIN" \
            --expected-origin "$IORI_SMOKE_ORIGIN" \
            --allowed-hostname "$TF_VAR_public_hostname" \
            --checks-json "$IORI_SMOKE_CHECKS_JSON" \
            --smoke-queue-token "$IORI_SMOKE_QUEUE_TOKEN" >"$output" 2>&1
          node apps/iori/scripts/assert-workflow-output.mjs <"$output"
          rm -f "$output"
