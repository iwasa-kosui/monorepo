name: Deploy iori Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/iori/**"
      - "packages/result/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-iori-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-iori-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages/result
        run: pnpm --filter result run build

      - name: Type check iori
        run: pnpm --filter iori run typecheck

      - name: Deploy iori Worker
        run: pnpm --filter iori run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: ${{ vars.IORI_ORIGIN }}
          VAPID_SUBJECT: ${{ vars.IORI_VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.IORI_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.IORI_VAPID_PRIVATE_KEY }}
