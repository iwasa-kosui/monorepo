name: Deploy iori Worker

on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: Reviewed current main code SHA
        required: true
        type: string
      migration_main_sha:
        description: Immutable migration SHA (required for resume-source, release-pending-freeze and restart-failed-source; defaults to main_sha when empty otherwise)
        required: false
        type: string
      operation:
        description: Protected operation (maintenance choices explicitly stop before privileges)
        required: true
        type: choice
        options:
          - deploy-worker
          - put-worker-secrets
          - resume-source
          - release-pending-freeze
          - restart-failed-source
          - diagnose-source
          - reconcile-resources
          - replace-queue-consumer
          - delete-rehearsal-d1
          - move-unfollowed-reposts-dry-run
          - move-unfollowed-reposts
          - delete-unfollowed-posts-dry-run
          - delete-unfollowed-posts
          - domain-events-stats
          - prune-federated-posts-dry-run
          - ensure-event-archive-bucket
          - delete-blocked-domain-posts-dry-run
          - delete-blocked-domain-posts
      environment:
        description: Protected isolated destination and source environment
        required: true
        type: choice
        options: [production, staging]
      generation:
        description: Reviewed fresh generation (8-20 lowercase alphanumeric characters; leave empty for diagnose-source)
        required: false
        type: string
      migration_run_id:
        description: Immutable run ID (1-80 ASCII letters, digits, underscore or hyphen; leave empty for diagnose-source)
        required: false
        type: string
      recovery:
        description: Required for resume-source only (destination_writes_not_enabled or destination_writes_reconciled); leave empty otherwise
        required: false
        type: string
      repost_created_before_ms:
        description: Required for move-unfollowed-reposts-dry-run, move-unfollowed-reposts, delete-unfollowed-posts-dry-run and delete-unfollowed-posts only (epoch milliseconds, not in the future); leave empty otherwise
        required: false
        type: string

concurrency:
  group: deploy-iori-worker-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  MAIN_SHA: ${{ inputs.main_sha }}
  IORI_MIGRATION_MAIN_SHA: ${{ inputs.migration_main_sha }}
  IORI_OPERATION: ${{ inputs.operation }}
  IORI_ENVIRONMENT: ${{ inputs.environment }}
  IORI_GENERATION: ${{ inputs.generation }}
  IORI_MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
  IORI_RECOVERY: ${{ inputs.recovery }}
  IORI_REPOST_CREATED_BEFORE_MS: ${{ inputs.repost_created_before_ms }}
  WRANGLER_SEND_METRICS: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  public-artifact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record first-step deadline and gate trusted event
        shell: bash
        run: |
          set -euo pipefail
          printf 'IORI_JOB_STARTED_AT=%s000\n' "$(date +%s)" >> "$GITHUB_ENV"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$MAIN_SHA" = "$GITHUB_SHA"
          case "$IORI_OPERATION" in
            reconcile-resources|replace-queue-consumer) printf '%s\n' 'Maintenance operation requires a separate review.'; exit 1 ;;
          esac
      - name: Checkout trusted event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
      - name: Create fresh private job directory
        run: node apps/iori/scripts/hosted-workflow.mjs init
      - name: Install and build with private diagnostics
        run: node apps/iori/scripts/hosted-workflow.mjs setup
      - name: Check public artifact policy with sanitized output
        run: node apps/iori/scripts/hosted-workflow.mjs public-check
      - name: Remove this job's private directory
        if: always() && env.IORI_PRIVATE_DIRECTORY != ''
        run: node apps/iori/scripts/cleanup-private-workflow-directory.mjs

  deploy-worker:
    if: inputs.operation == 'deploy-worker'
    needs: public-artifact-gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.environment }}
    steps:
      - name: Record first-step deadline and gate trusted event
