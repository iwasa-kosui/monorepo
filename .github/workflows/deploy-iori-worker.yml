            reconcile-resources|replace-queue-consumer) printf '%s\n' 'Maintenance operation requires a separate review.'; exit 1 ;;
          esac
      - name: Checkout trusted event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
      - name: Create fresh private job directory
        run: node apps/iori/scripts/hosted-workflow.mjs init
      - name: Install and build with private diagnostics
        run: node apps/iori/scripts/hosted-workflow.mjs setup
      - name: Run fixed protected operation
        run: node apps/iori/scripts/hosted-workflow.mjs operate
        env:
          IORI_ADMISSION_MODE: sealed
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          IORI_ADMISSION_IDENTITY: ${{ secrets.IORI_ADMISSION_IDENTITY }}
          ORIGIN: ${{ secrets.ORIGIN }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.IORI_CLOUDFLARE_DEPLOY_API_TOKEN }}
      - name: Remove this job's private directory
        if: always() && env.IORI_PRIVATE_DIRECTORY != ''
        run: node apps/iori/scripts/cleanup-private-workflow-directory.mjs

