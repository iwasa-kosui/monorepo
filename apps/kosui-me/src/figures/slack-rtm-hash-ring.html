<title id="fig-shr-1-title">チャンネル ID から担当の CS を決める流れ</title>
<desc id="fig-shr-1-desc">左に #general、#dev、ファイル、ハドルの 4 つのチャンネル ID が並びます。それぞれが hash を通り、右の円形のリング上の位置に写されます。リングには CS-1 から CS-4 の 4 台が等間隔に並んでいます。各チャンネルは、リング上の位置から時計回りに進んで最初に出会う CS に割り当てられます。#general は CS-2、#dev は CS-3、ファイルは CS-4、ハドルは CS-1 が担当します。アニメーションでは、チャンネルが 1 つずつ hash を通り、リングを時計回りに進んで担当の CS に届く様子を、12 秒周期でくり返し示します。</desc>

<title id="fig-shr-2-title">不健全な CS を入れ替える流れ</title>
<desc id="fig-shr-2-desc">左に、CS-1 から CS-4 が並ぶ円形のリングがあります。CS-2 が不健全になり、リングのうち CS-2 の担当範囲だけ配信が遅れます。ほかの CS の担当範囲は影響を受けません。右の CHARM が、CS-2 を新しい CS に入れ替えます。20 秒未満で配信が再開します。アニメーションでは、ほかの CS にはメッセージが届き続ける一方、CS-2 行きのメッセージは途中で止まり、CHARM が新しい CS を投入したあとに届く様子を、12 秒周期でくり返し示します。</desc>
