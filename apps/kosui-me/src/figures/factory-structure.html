<svg viewBox="0 0 568 480" role="img" aria-labelledby="fig-fs-3-title fig-fs-3-desc">
<title id="fig-fs-3-title">ループの構造</title>
<desc id="fig-fs-3-desc">上段の左に、人が記述する意図と、ナレッジベースが並ぶ図です。この2つから、エージェントがバックログと論点を生成します。バックログからは、課題を取得する線が worker と reviewer の循環へ向かいます。論点からは、人が回答する線が人へ向かい、仮の案で実装を継続する破線が worker と reviewer の循環へ向かいます。worker と reviewer の循環は、指摘が解消されるまで自動で反復されます。循環の出力は PR になり、PR の上には、PR ごとに作成する解説ページがあります。人が解説ページを読んで判断する線は、判断・マージに向かいます。PR と判断・マージの間には、上限のあるレビュー待ちの列があります。上限に達すると、新しい課題を取得しない経路が worker に戻ります。下部では、retro がスキル改善の PR を作成し、その PR が判断・マージに届きます。アニメーションでは、意図から課題が生まれ、worker と reviewer が PR を作り、レビュー待ちが上限に達すると止まり、人が判断・マージすると再び流れる様子を、16秒周期でくり返し示します。</desc>
