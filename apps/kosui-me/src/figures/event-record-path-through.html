<style>
.fig-rpt {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  min-width: 0;
  border-radius: 12px;
  background: var(--fig-soft);
  padding: 1rem;
  overflow-x: auto;
  color: var(--fig-ink);
  font-size: 0.9375rem;
  line-height: 1.6;
}
.fig-rpt .fig-rpt-mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.875rem;
  overflow-wrap: anywhere;
}
.fig-rpt .fig-rpt-head {
  margin: 0;
  font-size: 0.9375rem;
  font-weight: 700;
  line-height: 1.6;
}
.fig-rpt-face-label {
  font-size: 0.875rem;
  font-weight: 700;
  line-height: 1.6;
}
.fig-rpt-caller {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.25rem 0.5rem;
  border-radius: 10px;
  background-color: var(--fig-agent);
  padding: 0.75rem 1rem;
  color: var(--fig-on-agent);
}
.fig-rpt-caller-name {
  font-size: 0.875rem;
  font-weight: 700;
}
.fig-rpt-tx {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-inline-start: 1rem;
  border-radius: 10px;
  background-color: var(--fig-surface);
  padding: 0.75rem 1rem;
}
.fig-rpt-tx-label {
  --base: transparent;
  align-self: flex-start;
  margin-inline-start: -0.5rem;
  border-radius: 4px;
  background-color: var(--base);
  padding: 0 0.5rem;
  color: var(--fig-muted);
}
.fig-rpt-step {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 4rem minmax(0, 1.25fr);
  align-items: center;
  gap: 0.5rem;
}
.fig-rpt-stmt {
  --base: var(--fig-soft);
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0;
  border-radius: 8px;
  background-color: var(--base);
  padding: 0.5rem 0.75rem;
}
.fig-rpt-stmt-note {
  color: var(--fig-muted);
  font-size: 0.875rem;
  line-height: 1.6;
}
.fig-rpt-arrow {
  display: block;
  color: var(--fig-muted);
  line-height: 0;
}
.fig-rpt-arrow svg {
  display: block;
  overflow: visible;
  width: 100%;
  height: auto;
}
.fig-rpt-shaft,
.fig-rpt-head-mark {
  fill: none;
  stroke: currentColor;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.fig-rpt-dot {
  fill: var(--fig-agent);
  opacity: 0;
}
.fig-rpt-store {
  --base: var(--fig-agent-soft);
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0;
  border-radius: 8px;
  background-color: var(--base);
  padding: 0.5rem 0.75rem;
}
.fig-rpt-store-name {
  font-size: 0.875rem;
  font-weight: 700;
  line-height: 1.6;
}
.fig-rpt-row {
  --base: var(--fig-surface);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.25rem 0.75rem;
  border-radius: 4px;
  background-color: var(--base);
  padding: 0.25rem 0.5rem;
}
.fig-rpt-cell {
  min-width: 0;
  font-size: 0.875rem;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.fig-rpt-status {
  display: inline-grid;
}
.fig-rpt-status-before,
.fig-rpt-status-after {
  grid-area: 1 / 1;
}
.fig-rpt-status-before {
  opacity: 0;
}

@media (max-width: 40rem) {
  .fig-rpt-step {
    grid-template-columns: minmax(0, 1fr);
  }
  .fig-rpt-arrow {
    display: grid;
    place-items: center;
    justify-self: center;
    width: 4rem;
    height: 4rem;
  }
  .fig-rpt-arrow svg {
    transform: rotate(90deg);
  }
}

@media (prefers-reduced-motion: no-preference) {
  .fig-rpt {
    --cycle: 10s;
    --lit: color-mix(in srgb, var(--fig-agent) 30%, var(--fig-surface));
  }

  .fig-rpt-update {
    animation: fig-rpt-lit-update var(--cycle) linear infinite;
  }
  .fig-rpt-arrow-update .fig-rpt-dot {
    animation: fig-rpt-travel-update var(--cycle) linear infinite;
  }
  .fig-rpt-status-before {
    animation: fig-rpt-status-before var(--cycle) linear infinite;
  }
  .fig-rpt-status-after {
    animation: fig-rpt-status-after var(--cycle) linear infinite;
  }
  .fig-rpt-visits .fig-rpt-row {
    animation: fig-rpt-lit-visits var(--cycle) linear infinite;
  }
  .fig-rpt-insert {
    animation: fig-rpt-lit-insert var(--cycle) linear infinite;
  }
  .fig-rpt-arrow-insert .fig-rpt-dot {
    animation: fig-rpt-travel-insert var(--cycle) linear infinite;
  }
  .fig-rpt-row-new {
    animation: fig-rpt-row-new var(--cycle) linear infinite;
  }
  .fig-rpt-tx-label {
    animation: fig-rpt-lit-tx var(--cycle) linear infinite;
  }

  @keyframes fig-rpt-lit-update {
    0%,
    6%,
    24%,
    100% {
      background-color: var(--base);
    }
    9%,
    21% {
      background-color: var(--lit);
    }
  }
  @keyframes fig-rpt-travel-update {
    0%,
    11% {
      opacity: 0;
      transform: translate(0, 0);
    }
    12% {
      opacity: 1;
      transform: translate(0, 0);
    }
    21% {
      opacity: 1;
      transform: translate(42px, 0);
    }
    22%,
    100% {
      opacity: 0;
      transform: translate(42px, 0);
    }
  }
  @keyframes fig-rpt-status-before {
    0%,
    22% {
      opacity: 1;
    }
    24%,
    96% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }
  @keyframes fig-rpt-status-after {
    0%,
    22% {
      opacity: 0;
    }
    24%,
    96% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }
  @keyframes fig-rpt-lit-visits {
    0%,
    22%,
    36%,
    100% {
      background-color: var(--base);
    }
    25%,
    33% {
      background-color: var(--lit);
    }
  }
  @keyframes fig-rpt-lit-insert {
    0%,
    36%,
    54%,
    100% {
      background-color: var(--base);
    }
    39%,
    51% {
      background-color: var(--lit);
    }
  }
  @keyframes fig-rpt-travel-insert {
    0%,
    41% {
      opacity: 0;
      transform: translate(0, 0);
    }
    42% {
      opacity: 1;
      transform: translate(0, 0);
    }
    51% {
      opacity: 1;
      transform: translate(42px, 0);
    }
    52%,
    100% {
      opacity: 0;
      transform: translate(42px, 0);
    }
  }
  @keyframes fig-rpt-row-new {
    0%,
    52% {
      opacity: 0;
      background-color: var(--base);
    }
    55%,
    63% {
      opacity: 1;
      background-color: var(--lit);
    }
    66%,
    96% {
      opacity: 1;
      background-color: var(--base);
    }
    100% {
      opacity: 0;
      background-color: var(--base);
    }
  }
  @keyframes fig-rpt-lit-tx {
    0%,
    66%,
    92%,
    100% {
      background-color: var(--base);
      color: var(--fig-muted);
    }
    70%,
    88% {
      background-color: var(--lit);
      color: var(--fig-ink);
    }
  }
}
</style>

</span>
<div class="fig-rpt-store">

</div>
</figure>
